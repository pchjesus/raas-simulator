name: RAAS v5.9.1 readability and historical regression
on:
  pull_request:
    branches: [main, feat/learning-experience-v6]
  push:
    branches: [main]
  workflow_dispatch:
# B+ CI: cancel only superseded PR checks. Preserve every main and manual release/QA run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: B+ self-test and change scope
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/ci-scope.sh --self-test
          bash scripts/ci-scope.sh
      - name: Setup Node.js 22
        if: steps.scope.outputs.tier != 'docs'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all historical and current Node regression suites
        if: steps.scope.outputs.tier != 'docs'
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/regression-*.cjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Prepare Chromium for actual browser integration test
        if: steps.scope.outputs.tier != 'docs'
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run headless Chromium checks
        if: steps.scope.outputs.tier == 'full'
        run: node tests/browser-v5.5.2.cjs
      - name: Run current v5.9 interactive Chromium checks
        if: steps.scope.outputs.tier != 'docs'
        run: node tests/browser-v5.9.cjs
      - name: Run current v5.9.1 readability and session Chromium checks
        if: steps.scope.outputs.tier != 'docs'
        run: node tests/browser-v5.9.1.cjs
      - name: Run v6 learning experience and live clinical checks
        if: steps.scope.outputs.tier != 'docs'
        run: |
          node tests/browser-v6.cjs
          RAAS_TEST_TARGET=index.html node tests/browser-v5.9.cjs
          node tests/browser-content-ia.cjs
      - name: Upload browser screenshots
        if: always() && steps.scope.outputs.tier != 'docs'
        uses: actions/upload-artifact@v4
        with:
          name: raas-v5.9.1-browser-screens
          path: |
            browser-desktop-v5.5.2.png
            browser-mobile-nav-v5.5.2.png
            browser-integrated-v5.9.png
            browser-v5.9.1-mobile-readability.png
            browser-v5.9.1-clinical-readability.png
            browser-v5.9.1-desktop-readability.png
            artifacts/v6/*.png
            artifacts/content-ia/*.png
          if-no-files-found: ignore
